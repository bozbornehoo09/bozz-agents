# Vale settings for the refining-technical-writing skill. At run time check_prose.py copies this
# file into a throwaway StylesPath next to two styles: the Deslop pack that install.sh caches, and
# Plain, made of the detectors in Plain/ plus the rules it builds from references/word-lists.md.
# Vale's output is a list of candidates for the review to judge, not a count to drive to zero.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Deslop, Plain

# Plain.StackedEmDashes already flags more than one aside in a sentence, and a single aside is
# allowed (general-rules.md "Plain statements"), so Deslop's per-paragraph dash count is off.
Deslop.EmDashOveruse = NO
# Hedges are judged in context under "Plain statements": some record real uncertainty to keep.
Deslop.Hedging = NO
# Its substitutions would delete a "may" or "might" that expresses genuine doubt.
Deslop.HedgeCascade = NO
