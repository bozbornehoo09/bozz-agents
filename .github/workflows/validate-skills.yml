name: validate-skills

# On pull requests that touch skills, validate the canonical tree against the
# Agent Skills spec (required name/description, kebab name matching the dir).
# Generation + commit-back happens only on push to the default branch.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/generate-tool-skills.sh'
      - 'tests/**'
      - 'agents/**'
      - 'codex/agents/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical skills against the Agent Skills spec
        run: bash scripts/generate-tool-skills.sh --validate-only
      - name: Install zsh and jq (agent script tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh jq
      - name: Repo tests (bridge, context helpers, agents, skill measurements)
        run: python3 -I -m unittest discover -v -s tests
      - name: Skill script tests
        run: |
          python3 -I -m unittest discover -s skills/refining-technical-writing/scripts
          python3 -I -m unittest discover -s skills/design-doc-write/scripts
          python3 -I -m unittest discover -s skills/preparing-code-reviews/scripts
          python3 -I -m unittest discover -s skills/context-up/scripts
          python3 -I -m unittest discover -s skills/update-context/scripts
          python3 -I -m unittest discover -s skills/update-decisions/scripts
      - name: Skill size limits
        run: python3 -I skills/skill-review/scripts/measure_skills.py skills --strict
      - name: Codex roles match canonical agents
        run: python3 -I agents/shared/build_codex_roles.py --check
